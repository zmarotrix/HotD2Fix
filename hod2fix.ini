; hod2fix - native DirectX 7 -> Direct3D 9Ex renderer for The House of the Dead 2
; Delete this file to go back to the defaults shown here.

[Display]
; 1 = borderless fullscreen, 0 = window.  Alt+Enter switches while playing.
Fullscreen=1
; Window size as a multiple of 640x480 (0 = largest that fits the screen).
WindowScale=0
; Internal 3D resolution as a multiple of 640x480 (0 = auto: fits the monitor
; height, e.g. 3 = 1920x1440 on a 1440p screen).
RenderScale=0
; float = 32-bit floating-point depth buffer: no flickering where surfaces lie
; almost on top of each other (e.g. the floor in the Magician fight).
; Anti-aliasing is then done by rendering at twice the resolution.
; 24 = classic 24-bit depth buffer with MSAA.
DepthBuffer=float
; Anti-aliasing: 0 = off; 2, 4 or 8 = MSAA with DepthBuffer=24, or 2x
; supersampling with DepthBuffer=float.
MSAA=4
; 1 = bilinear filtering on 3D models/levels (the PC port uses blocky point
; sampling); 2D HUD and text are never touched.  0 = original look.
SmoothTextures=0
; 1 = transparent effects (fire, smoke, sparks) no longer cut see-through
; "halos" into whatever is behind them.  0 = original behaviour.
FixAlphaHalos=1
; How opaque (1-255) part of an effect must be to still hide things behind it.
; 255 = only fully solid parts, 256 = effects never hide what's behind them.
HaloAlphaRef=255
; 1 = with SmoothTextures, stop sprites picking up a line of the neighbouring
; image at their edges (e.g. above distant towers).
SpriteEdgeFix=1
; Key that flips SmoothTextures while playing, for comparison.
SmoothToggleKey=F9
; Key that flips FixAlphaHalos while playing, for comparison.
HaloToggleKey=F11
; Anisotropic filtering for smoothed textures: 0/1 = off, up to 16.
Anisotropy=16
; 1 = wait for vertical blank (only if your monitor runs at 60 Hz).
VSync=0
; Frame limiter.  The game logic runs at 60 Hz; keep this at 60.
FPSLimit=60
; 1 = keep 4:3 with black bars, 0 = stretch to the window.
KeepAspect=1
; 1 = smooth final upscale, 0 = sharp (nearest neighbour).
LinearScale=1

[Input]
; Map the mouse/lightgun position from the scaled picture back into the
; game's 640x480 space, so aiming lines up at any window size.
RemapCursor=1
; 1 = keep the mouse cursor inside the game window while it has focus.
ClipCursor=0

[Audio]
; 1 = hod2fix's own mixer outputs sound over WASAPI (low latency, follows the
; Windows default device).  0 = use Windows' DirectSound like before.
Enabled=1
; Output period in milliseconds (lower = less delay; raise it if you hear crackles).
LatencyMs=10
; Master volume, 0-100.
Volume=100
; 1 = smoothly turn the level down when many loud sounds overlap, instead of
; distorting.  0 = hard clipping like the original.
Limiter=1
; Part of an output device's name, e.g. "Headphones" (empty = Windows default).
Device=

[Screenshot]
; Saves a PNG at full internal resolution to the "screenshots" folder.
; F1-F24, PrintScreen, ScrollLock, Pause, Insert, Home, End, a letter, or None.
Key=F12
; 1 = show a short notice in the corner when a screenshot is saved.
Notify=1

[System]
; 1 = skip the SEGA and Empire logo cards at startup (European release).
SkipIntroLogos=1
; Hold this key to run the game faster, e.g. to get through cutscenes and the
; ending credits.  F1-F24, Tab, Backspace, a letter, ... or None.
FastForwardKey=F7
; How much faster (2-32).
FastForwardSpeed=8
; 1 = the game pauses when it loses focus (original behaviour).
PauseInBackground=1
; 1 = 1 ms system timer resolution while the game runs (smoother pacing).
HighResTimer=1
; 0 = no log, 1 = hod2fix.log with startup info and problems, 2 = verbose.
Log=1

[Debug]
; Save every Nth presented frame as a BMP next to the game (0 = off).
DumpEvery=0
; Key that logs every draw under the cursor for one frame to hod2fix.log.
ProbeKey=F8
; Save every texture the game loads as PNG to textures_dump (0 = off).
DumpTextures=0
